<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora Proxy</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-2: #0d1728;
        --panel: rgba(15, 25, 38, 0.82);
        --panel-strong: rgba(14, 22, 34, 0.96);
        --border: rgba(163, 184, 255, 0.16);
        --text: #edf5ff;
        --muted: #aab9d1;
        --accent: #7cc7ff;
        --accent-2: #9d8cff;
        --success: #6fe7af;
        --shadow: 0 25px 70px rgba(3, 10, 22, 0.7);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(124,199,255,0.16), transparent 30%),
          radial-gradient(circle at bottom right, rgba(157,140,255,0.16), transparent 32%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
      }

      .glow {
        position: fixed;
        width: 28rem;
        height: 28rem;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.28;
        pointer-events: none;
      }

      .g1 { top: -9rem; left: -4rem; background: rgba(124,199,255,0.4); }
      .g2 { right: -7rem; bottom: -10rem; background: rgba(157,140,255,0.36); }

      .container {
        width: min(1200px, calc(100% - 24px));
        margin: 0 auto;
      }

      .topbar {
        padding: 20px 0 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #06111e;
        font-size: 0.85rem;
      }

      .nav-btn {
        appearance: none;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.4fr 0.7fr;
        gap: 22px;
        align-items: end;
        padding-top: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .main-panel {
        padding: 34px 30px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 5vw, 4.2rem);
        line-height: 1.04;
        letter-spacing: -0.065em;
      }

      .subtext {
        margin: 18px 0 26px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .searchbar {
        display: flex;
        gap: 14px;
        background: rgba(9, 16, 25, 0.72);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 8px 8px 8px 16px;
      }

      .searchbar input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 1rem;
      }

      .searchbar input::placeholder {
        color: rgba(237, 245, 255, 0.42);
      }

      .searchbar button {
        appearance: none;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #081522;
        border-radius: 12px;
        padding: 14px 22px;
        font-weight: 800;
        cursor: pointer;
      }

      .quick-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .chip {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        border-radius: 999px;
        padding: 9px 13px;
        cursor: pointer;
      }

      .side-panel {
        padding: 22px 18px;
      }

      .service {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 22px;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 18px rgba(111, 231, 175, 0.8);
      }

      .stats {
        display: grid;
        gap: 12px;
      }

      .stat {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        background: rgba(255,255,255,0.01);
      }

      .stat span {
        color: var(--muted);
      }

      .browser {
        margin-top: 20px;
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid var(--border);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 14px;
        background: rgba(8, 14, 22, 0.9);
        border-bottom: 1px solid var(--border);
      }

      .dots {
        display: flex;
        gap: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .dot.red { background: #ff5f57; }
      .dot.yellow { background: #ffbd2e; }
      .dot.green { background: #28c840; }

      .browser-url {
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 60%;
      }

      iframe {
        width: 100%;
        height: 72vh;
        min-height: 520px;
        display: block;
        border: none;
        background: white;
      }

      @media (max-width: 930px) {
        .hero {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .searchbar {
          flex-direction: column;
          padding: 12px;
        }

        .searchbar button {
          width: 100%;
        }

        .browser-url {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="container">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">A</div>
          <span>Aurora Proxy</span>
        </div>

        <button id="newTabBtn" class="nav-btn" type="button">Open direct</button>
      </header>

      <main class="hero">
        <section class="panel main-panel">
          <p class="eyebrow">Self-hosted browsing</p>
          <h1>Browse the web from your own app.</h1>
          <p class="subtext">
            A sleek, modern proxy portal built to feel premium without depending on third-party blocker services.
          </p>

          <form id="proxyForm" class="searchbar" autocomplete="off">
            <input id="urlInput" type="text" value="https://example.com" spellcheck="false" />
            <button type="submit">Open</button>
          </form>

          <div class="quick-links">
            <button class="chip" data-url="https://example.com" type="button">example.com</button>
            <button class="chip" data-url="https://github.com" type="button">github.com</button>
            <button class="chip" data-url="https://wikipedia.org" type="button">wikipedia.org</button>
          </div>
        </section>

        <aside class="panel side-panel">
          <div class="service">
            <span class="status-dot"></span>
            <span>Frontend + backend split</span>
          </div>

          <div class="stats">
            <div class="stat"><span>UI</span><strong>Modern</strong></div>
            <div class="stat"><span>Host</span><strong>GitHub Pages</strong></div>
            <div class="stat"><span>Proxy</span><strong>Serverless API</strong></div>
          </div>
        </aside>
      </main>

      <section class="browser panel">
        <div class="toolbar">
          <div class="dots">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <div id="browserUrl" class="browser-url">https://example.com</div>
        </div>

        <iframe id="proxyFrame" title="Web proxy viewer" sandbox="allow-scripts allow-forms allow-popups"></iframe>
      </section>
    </div>

    <script>
      const form = document.getElementById('proxyForm');
      const input = document.getElementById('urlInput');
      const frame = document.getElementById('proxyFrame');
      const browserUrl = document.getElementById('browserUrl');
      const newTabBtn = document.getElementById('newTabBtn');

      const PROXY_API = 'https://your-worker.example.workers.dev/proxy';

      function normalizeUrl(raw) {
        const value = raw.trim();
        if (!value) return '';
        if (/^https?:\/\//i.test(value)) return value;
        return `https://${value}`;
      }

      function loadPage(rawUrl) {
        const safe = normalizeUrl(rawUrl);
        if (!safe) return;

        input.value = safe;
        browserUrl.textContent = safe;
        frame.src = `${PROXY_API}?url=${encodeURIComponent(safe)}`;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        loadPage(input.value);
      });

      document.querySelectorAll('.chip').forEach((button) => {
        button.addEventListener('click', () => {
          loadPage(button.dataset.url);
        });
      });

      newTabBtn.addEventListener('click', () => {
        const safe = normalizeUrl(input.value);
        if (safe) window.open(safe, '_blank', 'noopener');
      });

      loadPage(input.value);
    </script>
  </body>
</html>
