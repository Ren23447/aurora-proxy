<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora Access</title>
    <meta name="description" content="A modern self-hosted browser portal with a premium dark glass interface." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-blur blur-one"></div>
    <div class="bg-blur blur-two"></div>

    <div class="container">
      <header class="topbar">
        <div class="brand-wrap" aria-label="Aurora Access brand">
          <div class="brand-mark">A</div>
          <span class="brand-name">Aurora Access</span>
        </div>

        <button id="newTabBtn" class="nav-btn" type="button">Open direct</button>
      </header>

      <main class="hero">
        <section class="glass-panel hero-panel">
          <p class="eyebrow">Self-hosted browsing</p>
          <h1>Browse the web through your own modern portal.</h1>
          <p class="subtext">
            Built with a cleaner visual identity and a more premium interface inspired by modern proxy dashboards.
          </p>

          <form id="proxyForm" class="searchbar" autocomplete="off">
            <input id="urlInput" type="text" value="https://example.com" spellcheck="false" />
            <button type="submit">Open</button>
          </form>

          <div class="quick-links" aria-label="Quick links">
            <button class="chip" data-url="https://example.com" type="button">example.com</button>
            <button class="chip" data-url="https://github.com" type="button">github.com</button>
            <button class="chip" data-url="https://wikipedia.org" type="button">wikipedia.org</button>
          </div>
        </section>

        <aside class="glass-panel side-panel">
          <div class="service-status">
            <span class="status-dot"></span>
            <span>Frontend + backend split</span>
          </div>

          <div class="stats">
            <div class="stat-row"><span>Theme</span><strong>Glass Neon</strong></div>
            <div class="stat-row"><span>Host</span><strong>GitHub Pages</strong></div>
            <div class="stat-row"><span>Proxy</span><strong>Backend API</strong></div>
          </div>
        </aside>
      </main>

      <section class="browser-shell glass-panel">
        <div class="browser-toolbar">
          <div class="traffic-lights">
            <span class="light red"></span>
            <span class="light yellow"></span>
            <span class="light green"></span>
          </div>
          <div id="browserUrl" class="browser-url">https://example.com</div>
        </div>

        <iframe id="proxyFrame" title="Web proxy viewer" sandbox="allow-scripts allow-forms allow-popups"></iframe>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
